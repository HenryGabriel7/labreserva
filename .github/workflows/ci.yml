name: Qualidade
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aplicativo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verificar e testar o worker Deno sem serviços externos
        run: |
          npm exec --yes --package=deno@2.9.6 -- deno check --config supabase/functions/processar-notificacoes/deno.json supabase/functions/processar-notificacoes/index.ts
          npm exec --yes --package=deno@2.9.6 -- deno test --allow-env --config supabase/functions/processar-notificacoes/deno.json supabase/functions/processar-notificacoes/index_test.ts
      - name: Subir Supabase local no Docker do runner
        run: npx supabase start --exclude studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Restaurar banco local e executar pgTAP real
        run: |
          npm run db:reset
          npm run test:db
      - name: Configurar apenas credenciais do Supabase de loopback
        run: node scripts/ci-env.mjs
      - name: Integração real, concorrência e revogação
        run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Instalar Chromium e bibliotecas do sistema
        run: npx playwright install --with-deps chromium
      - name: E2E desktop, 360 px, WCAG e fluxos Supabase
        run: npm run test:e2e
      - name: Guardar relatório de testes locais
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Encerrar serviços locais
        if: always()
        run: npx supabase stop --no-backup
